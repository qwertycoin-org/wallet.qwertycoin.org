name: Required CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-wallet-required-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wallet:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout immutable revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run wallet, UI, worker, and manifest contracts
        run: npm test
      - name: Reject whitespace errors
        run: git diff --check

  required:
    name: required
    if: always()
    needs: [wallet]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every gate
        env:
          WALLET_RESULT: ${{ needs.wallet.result }}
        run: test "$WALLET_RESULT" = success
