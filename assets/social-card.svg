<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Background — solid dark, no gradients (librsvg drops them) -->
  <rect width="1200" height="630" fill="#0a0a0a"/>

  <!-- Subtle decorative grid -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <line x1="0"   y1="0"   x2="0"   y2="630"/>
    <line x1="240" y1="0"   x2="240" y2="630"/>
    <line x1="480" y1="0"   x2="480" y2="630"/>
    <line x1="720" y1="0"   x2="720" y2="630"/>
    <line x1="960" y1="0"   x2="960" y2="630"/>
    <line x1="1200" y1="0"  x2="1200" y2="630"/>
  </g>

  <!-- Decorative gold rings for the Qwertycoin palette -->
  <circle cx="1100" cy="80" r="200" fill="#ffaf00" opacity="0.08"/>
  <circle cx="100"  cy="550" r="180" fill="#ffaf00" opacity="0.05"/>

  <!-- ─── Logo (left side, vertically centered) ─── -->
  <image href="qwertycoin-mark.svg" x="110" y="187" width="256" height="256"/>

  <!-- ─── Right side text block (centered vertically around 315) ─── -->

  <!-- Eyebrow tag — short on purpose -->
  <text x="430" y="195" font-family="DejaVu Sans, sans-serif" font-size="22"
        font-weight="700" fill="#ffaf00" letter-spacing="2">NON-CUSTODIAL · OPEN SOURCE</text>

  <text x="430" y="275" font-family="DejaVu Sans, sans-serif" font-size="64"
        font-weight="900" fill="#eae8e4">Qwertycoin</text>
  <text x="430" y="345" font-family="DejaVu Sans, sans-serif" font-size="64"
        font-weight="900" fill="#ffaf00">Wallet</text>

  <!-- Tagline -->
  <text x="430" y="390" font-family="DejaVu Sans, sans-serif" font-size="26"
        font-weight="500" fill="#9a9894">The official QWC wallet in your browser</text>

  <!-- Format pills row -->
  <g transform="translate(430, 425)">
    <g>
      <rect x="0" y="0" width="230" height="42" rx="21" fill="#2b2100" stroke="#7a5700"/>
      <text x="115" y="28" font-family="DejaVu Sans Mono, monospace" font-size="16"
            font-weight="600" fill="#ffaf00" text-anchor="middle">25-word QWC seed</text>
    </g>
    <g transform="translate(245, 0)">
      <rect x="0" y="0" width="190" height="42" rx="21" fill="#19191d" stroke="#262630"/>
      <text x="95" y="28" font-family="DejaVu Sans Mono, monospace" font-size="16"
            font-weight="600" fill="#eae8e4" text-anchor="middle">client-side keys</text>
    </g>
  </g>

  <!-- Footer line — kept short -->
  <text x="430" y="520" font-family="DejaVu Sans, sans-serif" font-size="20"
        font-weight="500" fill="#6e6c6a">wallet.qwertycoin.org</text>
  <text x="665" y="520" font-family="DejaVu Sans, sans-serif" font-size="20"
        font-weight="500" fill="#6e6c6a">·  zero downloads  ·  zero trackers  ·  MIT</text>
</svg>
